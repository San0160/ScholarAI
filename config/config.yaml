artifacts_root: artifacts

data:
  raw_data_path: data/raw
  processed_data_path: data/processed
  vector_db_path: data/vector_db

server:
  host: 0.0.0.0
  port: 8000

logging:
  level: INFO

chunking:
  chunk_size: 350
  chunk_overlap: 50

embeddings:
  provider: huggingface
  model: BAAI/bge-small-en-v1.5
  device: auto
  batch_size: 32
  show_progress_bar: false

vector_store:
  provider: faiss
  path: data/vector_db
  index_name: scholarai.index
  documents_name: documents.pkl

retrieval:
  candidate_k: 10

llm:
  provider: huggingface
  model: Qwen/Qwen2.5-3B-Instruct
  device: auto
  max_context_tokens: 1024
  max_new_tokens: 256

reranking:
  provider: cross_encoder
  model: BAAI/bge-reranker-v2-m3
  top_k: 3