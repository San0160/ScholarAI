artifacts_root: artifacts

data:
  raw_data_path: data/raw
  processed_data_path: data/processed
  vector_db_path: data/vector_db

server:
  host: 0.0.0.0
  port: 8000

logging:
  level: INFO

chunking:
  chunk_size: 350
  chunk_overlap: 50

#embeddings:
#  provider: huggingface
#  model: BAAI/bge-small-en-v1.5
#  device: auto
#  batch_size: 32
#  show_progress_bar: false

embeddings:
  provider: api
  model: nvidia/llama-nemotron-embed-vl-1b-v2
  api_base_url: https://integrate.api.nvidia.com/v1
  api_key_env_var: NVIDIA_API_KEY
  dimension: 2048

vector_store:
  provider: faiss
  path: data/vector_db
  index_name: scholarai.index
  documents_name: documents.pkl

retrieval:
  candidate_k: 10

llm:
  provider: api
  model: openai/gpt-oss-120b
  api_base_url: https://api.groq.com/openai/v1
  api_key_env_var: GROQ_API_KEY
  max_context_tokens: 6500
  max_new_tokens: 1024

reranking:
  provider: api  # "api" (NVIDIA NIM hosted) | "cross_encoder" | "bge" -- model field's meaning depends on this
  model: nvidia/llama-nemotron-rerank-vl-1b-v2
  top_k: 8
  api_base_url: https://ai.api.nvidia.com/v1/retrieval/nvidia/llama-nemotron-rerank-vl-1b-v2/reranking
  api_key_env_var: RERANKER_API_KEY